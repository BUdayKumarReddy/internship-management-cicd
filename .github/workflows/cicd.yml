name: Internship Management CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-2
  ECR_REGISTRY: 105003116566.dkr.ecr.ap-south-2.amazonaws.com
  ECR_BACKEND_REPOSITORY: internship-backend
  ECR_FRONTEND_REPOSITORY: internship-frontend

jobs:

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker-build:
    name: Docker Build and Push
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:${{ github.sha }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:${{ github.sha }} \
            ./frontend

      - name: Push backend image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:${{ github.sha }}

      - name: Push frontend image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:${{ github.sha }}