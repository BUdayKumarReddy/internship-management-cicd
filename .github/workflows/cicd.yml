name: Internship Management CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-2
  ECR_REGISTRY: 105003116566.dkr.ecr.ap-south-2.amazonaws.com
  ECR_BACKEND_REPOSITORY: internship-backend
  ECR_FRONTEND_REPOSITORY: internship-frontend

jobs:

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker-build:
    name: Docker Build and Push
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:${{ github.sha }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:${{ github.sha }} \
            ./frontend

      - name: Push backend image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:${{ github.sha }}

      - name: Push frontend image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:${{ github.sha }}
  deploy:
    name: Deploy to EC2
    needs: docker-build
    runs-on: ubuntu-latest

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            ECR_REGISTRY="105003116566.dkr.ecr.ap-south-2.amazonaws.com"
            AWS_REGION="ap-south-2"

            echo "Logging in to Amazon ECR..."

            aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "Pulling backend image..."

            docker pull \
            $ECR_REGISTRY/internship-backend:${{ github.sha }}

            echo "Pulling frontend image..."

            docker pull \
            $ECR_REGISTRY/internship-frontend:${{ github.sha }}

            echo "Removing old containers..."

            docker rm -f internship-backend || true
            docker rm -f internship-frontend || true

            echo "Starting backend..."

            docker run -d \
              --name internship-backend \
              --restart unless-stopped \
              --env-file /opt/internship-app/backend.env \
              -p 5000:5000 \
              $ECR_REGISTRY/internship-backend:${{ github.sha }}

            echo "Starting frontend..."

            docker run -d \
              --name internship-frontend \
              --restart unless-stopped \
              -p 5173:5173 \
              $ECR_REGISTRY/internship-frontend:${{ github.sha }}

            echo "Waiting for application..."

            sleep 10

            echo "Checking backend health..."

            curl --fail http://localhost:5000/api/health

            echo "Deployment successful!"